<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>měření posuvného grafu ringu</title>
<style>
  body { background:#1a1715; color:#e8e2dc; font:13px sans-serif; margin:0; }
  main { max-width: 420px; margin: 0 auto; padding: 12px; }
  /* přesně jako src/style.css */
  .chart { width:100%; display:block; background:#231f1c; border:1px solid #3a3330; border-radius:6px; }
  .chart-wrap { position:relative; margin:10px 0 4px; }
  .chart-wrap .chart { margin:0; }
  .chart-wrap .chart-head { position:absolute; inset:0; width:100%; height:230px; display:block; pointer-events:none; }
  .chart-wrap.scrollable { overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  .chart-wrap.scrollable .chart-head { position:sticky; left:0; width:100%; }
  pre { white-space:pre-wrap; background:#231f1c; border:1px solid #3a3330; padding:8px; }
</style></head>
<body><main>
  <div class="chart-wrap" id="wrap">
    <canvas id="c-spr" class="chart" height="230"></canvas>
    <canvas id="c-spr-head" class="chart-head" height="230" aria-hidden="true"></canvas>
  </div>
  <pre id="out">…</pre>
<script type="module">
import { drawSpr, drawSprHead, sprNeededWidth } from '../src/charts.js';

const Q = new URLSearchParams(location.search);
if (Q.has('fix')) {   // ← NAVRHOVANÁ OPRAVA: jen zrušit sticky/width:100% přepis
  const st = document.createElement('style');
  st.textContent = '.chart-wrap.scrollable .chart-head { position:absolute; left:0; top:0; }';
  document.head.appendChild(st);
}
if (Q.has('pan')) {   // varianta: posuv přes transform, bez nativního scrollu
  const st = document.createElement('style');
  st.textContent = '.chart-wrap.scrollable { overflow:hidden; touch-action:pan-y; }' +
                   '.chart-wrap.scrollable .chart-head { position:absolute; left:0; top:0; }';
  document.head.appendChild(st);
}

/* Tóny: jediný „červený" (ring_ok=false) je ten, na kterém stojí ukazatel. */
const N = 120;
const NOTES = [];
for (let i = 0; i < N; i++) {
  NOTES.push({ t_start: i * 1.0, t_end: i * 1.0 + 0.8, spr: -14 + (i % 3) * 0.2, ring_ok: i !== 60 });
}
const SUMMARY = { ring_threshold: -17.5, reason: '' };
const DUR = N, TARGET = 60.4;

const wrap = document.getElementById('wrap');
const chart = document.getElementById('c-spr');
const head = document.getElementById('c-spr-head');

const need = sprNeededWidth(wrap.clientWidth || 400, NOTES, DUR);
const S = Number(Q.get('s') || 0);
const usePan = Q.has('pan');

wrap.classList.toggle('scrollable', !!need);
chart.style.width = need ? need + 'px' : '';
head.style.width = need ? need + 'px' : '';

const state = { width: need, offX: S };
if (usePan) { chart.style.transform = `translateX(${-S}px)`; head.style.transform = `translateX(${-S}px)`; }
else wrap.scrollLeft = S;

drawSpr(chart, NOTES, SUMMARY, null, state);
drawSprHead(head, NOTES, SUMMARY, TARGET, state);

const rect = (el) => { const r = el.getBoundingClientRect(); return r; };

/* Najdi v bufferu sloupce dané barvy a převeď je do souřadnic OKNA. */
function findColor(cv, rgb, minRows) {
  const ctx = cv.getContext('2d');
  const img = ctx.getImageData(0, 0, cv.width, cv.height);
  const dpr = cv.width / cv.clientWidth;
  const r = rect(cv);
  const xs = [];
  for (let x = 0; x < cv.width; x++) {
    let n = 0;
    for (let y = Math.floor(img.height * 0.35); y < img.height; y += 3) {
      const i = (y * cv.width + x) * 4;
      if (Math.abs(img.data[i] - rgb[0]) < 12 && Math.abs(img.data[i+1] - rgb[1]) < 12 &&
          Math.abs(img.data[i+2] - rgb[2]) < 14) n++;
    }
    if (n > minRows) xs.push({ bufX: x, viewX: r.left + x / dpr, rows: n });
  }
  return xs;
}

const reds = findColor(chart, [0xb5, 0x67, 0x5e], 4);       // sloupec bez ringu
const lights = findColor(head, [0xec, 0xe5, 0xdd], 20);     // čára ukazatele
const rb = rect(chart), hb = rect(head), wb = rect(wrap);

document.getElementById('out').textContent = JSON.stringify({
  varianta: usePan ? 'transform (bez nativního scrollu)' : (Q.has('fix') ? 'jen zrušený sticky' : 'SOUČASNÝ stav'),
  need, pozadovanyScroll: S,
  wrapClientW: wrap.clientWidth, wrapScrollW: wrap.scrollWidth, wrapScrollLeft: wrap.scrollLeft,
  wrap: { l:+wb.left.toFixed(1), t:+wb.top.toFixed(1), w:+wb.width.toFixed(1), h:+wb.height.toFixed(1) },
  graf: { l:+rb.left.toFixed(1), t:+rb.top.toFixed(1), w:+rb.width.toFixed(1), h:+rb.height.toFixed(1) },
  ukazatelPlatno: { l:+hb.left.toFixed(1), t:+hb.top.toFixed(1), w:+hb.width.toFixed(1), h:+hb.height.toFixed(1) },
  ukazatelNadGrafem: Math.abs(hb.top - rb.top) < 2,
  ukazatelPodGrafem: hb.top > rb.top + 10,
  cervenySloupecOkno: reds.length ? +(reds.reduce((a, b) => a + b.viewX, 0) / reds.length).toFixed(1) : null,
  caraUkazateleOkno: lights.length ? +(lights.reduce((a, b) => a + b.viewX, 0) / lights.length).toFixed(1) : null,
  rozdilPx: (reds.length && lights.length)
    ? +( (lights.reduce((a,b)=>a+b.viewX,0)/lights.length) - (reds.reduce((a,b)=>a+b.viewX,0)/reds.length) ).toFixed(1)
    : null,
}, null, 1);
</script>
</main></body></html>
