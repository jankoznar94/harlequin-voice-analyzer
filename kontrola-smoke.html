<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><title>smoke test aplikace</title></head>
<body>
<pre id="out">běží…</pre>
<script type="module">
/**
 * Ověří, že se aplikace skutečně NAČTE jako celek — že žádný modul nespadne
 * a že WASM jádro jde stáhnout a spustit přes http.
 *
 * Statický test propojení tohle nechytí: ten čte jen text souborů a nepozná
 * syntaktickou chybu ani to, že se .wasm nepodaří načíst.
 */
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; };
out.textContent = 'běží…';

const errors = [];
window.addEventListener('error', (e) => errors.push('window.error: ' + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + (e.reason?.message || e.reason)));

try {
  // 1. všechny moduly jde importovat
  const mods = [
    './src/analysis.js', './src/charts.js', './src/live.js',
    './src/live-charts.js', './src/dsp-backend.js',
  ];
  for (const m of mods) {
    const mod = await import(m);
    log(`OK import ${m} (${Object.keys(mod).length} exportů)`);
  }

  // live-run a live-ui sahají na DOM prvky — importovat je lze, spustit ne
  await import('./src/live-run.js');
  log('OK import ./src/live-run.js');

  // 2. WASM jádro přes http
  const { createDsp, loadWasm } = await import('./src/dsp-backend.js');
  await loadWasm('wasm/build/dsp.wasm');
  log('OK wasm/build/dsp.wasm stažen a přeložen');

  const dsp = await createDsp({ frameSize: 2048, sampleRate: 48000, fach: 'tenor', wasmUrl: 'wasm/build/dsp.wasm' });
  log('OK backend: ' + dsp.kind);
  if (dsp.kind !== 'wasm') errors.push('backend není WASM, ale ' + dsp.kind);

  // 3. prožene jeden rámec sinusovky a ověří, že najde výšku
  const frame = new Float64Array(2048);
  for (let i = 0; i < 2048; i++) frame[i] = 0.4 * Math.sin(2 * Math.PI * 440 * i / 48000);
  dsp.reset();
  const { createLiveState, feedFrame } = await import('./src/live.js');
  const st = createLiveState(48000, 2048);
  let snap = null;
  for (let k = 0; k < 5; k++) snap = feedFrame(st, dsp, frame);
  log(`OK živý rámec: f0=${snap.f0.toFixed(1)} Hz, tón=${snap.note}, úroveň=${snap.dbfs.toFixed(1)} dBFS`);
  if (Math.abs(snap.f0 - 440) > 2) errors.push('výška nesedí: ' + snap.f0);

  // 4. aplikace jako celek — hlavní prvky musí být v index.html.
  //    POZOR: kontroluje se stažený index.html, ne tato stránka. Testovací
  //    stránka ty prvky nemá a nikdy mít nebude — napoprvé mi test hlásil
  //    "chybí všechny prvky", což byla chyba testu, ne aplikace.
  const html = await (await fetch('index.html', { cache: 'no-store' })).text();
  const need = ['btn-live', 'panel-live', 'c-live-tune', 'c-live-spr', 'c-live-level', 'c-live-fhe',
                'btn-record', 'btn-update', 'fach', 'file-input', 'c-spr', 'c-spec',
                'btn-live-stop', 'btn-live-save', 'lv-note', 'lv-spr'];
  const missing = need.filter(id => !html.includes(`id="${id}"`));
  log(missing.length ? 'CHYBÍ prvky: ' + missing.join(', ') : 'OK všechny prvky jsou v index.html');
  if (missing.length) errors.push('chybí prvky: ' + missing.join(', '));

  // 5. index.html musí načítat živý režim a mít cache-busting
  if (!/src\/app\.js\?v=\d+/.test(html)) errors.push('index.html nemá cache-busting u app.js');
  if (!/src\/style\.css\?v=\d+/.test(html)) errors.push('index.html nemá cache-busting u style.css');

  document.getElementById('out').textContent += '\n\n' +
    (errors.length ? 'CHYBY (' + errors.length + '):\n' + errors.join('\n') : 'BEZ CHYB');
  out.textContent += '\nHOTOVO';
} catch (e) {
  out.textContent += '\nVÝJIMKA: ' + (e.stack || e.message) + '\nHOTOVO';
}
</script>
</body>
</html>
