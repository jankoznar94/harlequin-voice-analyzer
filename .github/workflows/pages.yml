name: Deploy to GitHub Pages

# Aplikace je čistě statická (žádný build krok), takže se publikuje celý
# adresář. Testy a vývojové soubory se vyřazují.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Spustit testy
        run: |
          node test/test-dsp.mjs
          echo "--- DSP testy prošly ---"

      - name: Připravit artefakt
        run: |
          mkdir -p _site
          # statické soubory aplikace
          cp index.html manifest.webmanifest sw.js icon.svg _site/
          cp -r src _site/
          # vývojové a testovací soubory do nasazení nepatří
          rm -rf _site/test _site/node_modules

      - uses: actions/configure-pages@v5
        with:
          # zapne GitHub Pages automaticky, pokud ještě nejsou zapnuté
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
