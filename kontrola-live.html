<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>kontrola živého indikátoru</title>
<style>
  /* Stejné hodnoty jako v aplikaci — test má měřit skutečný vzhled. */
  :root {
    --bg: #1a1715; --bg-soft: #231f1c; --bg-input: #2a2522; --line: #3a3330;
    --fg: #e8e2dc; --fg-dim: #a89f97; --fg-mute: #7d746d;
    --accent: #b8894f; --ok: #6a9e6a; --bad: #b5675e; --warn: #c39a5a;
    --radius: 6px;
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 sans-serif; padding: 16px; }
  .chart {
    width: 100%; display: block; margin: 0 0 12px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
</style>
</head>
<body>
<h3 id="hdr">měřím…</h3>
<canvas id="c1" class="chart" height="120"></canvas>
<canvas id="c2" class="chart" height="120"></canvas>
<canvas id="c3" class="chart" height="90"></canvas>
<canvas id="c4" class="chart" height="90"></canvas>
<pre id="out" style="font-size:12px;color:#a89f97;white-space:pre-wrap"></pre>

<script type="module">
import { loadColors, drawTuning, drawSprHistory, drawLevel, drawFhe } from './src/live-charts.js';
import { REFS } from './src/analysis.js';

const out = document.getElementById('out');
const log = (s) => { out.textContent += s + '\n'; };

/**
 * Najde pixely dané barvy a vrátí jejich rozsah.
 *
 * POZOR: sonda musí hledat KONKRÉTNÍ barvu, ne „vše, co není pozadí" — jinak
 * do výsledku spadne i základní pruh a text, a číslo pak vyjde stejné pro
 * všechny vstupy (přesně na to jsem napoprvé naletěla: „ručička se posunula
 * o 0 px", protože se měřila celá šířka pruhu).
 */
function findColor(cv, rgb, tol = 12, yFrom = 0, yTo = null) {
  const ctx = cv.getContext('2d');
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let n = 0, minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
  const y1 = yTo === null ? cv.height : yTo;
  for (let y = Math.max(0, Math.floor(yFrom)); y < Math.min(cv.height, y1); y++) {
    for (let x = 0; x < cv.width; x++) {
      const i = (y * cv.width + x) * 4;
      if (d[i + 3] < 200) continue;
      if (Math.abs(d[i] - rgb[0]) <= tol && Math.abs(d[i + 1] - rgb[1]) <= tol && Math.abs(d[i + 2] - rgb[2]) <= tol) {
        n++;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  return { n, minX, maxX, minY, maxY, cx: n ? (minX + maxX) / 2 : null };
}

/** Spočítá pixely, které nejsou průhledné — ověří, že se vůbec něco kreslí. */
function drawn(cv) {
  const ctx = cv.getContext('2d');
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let n = 0;
  for (let i = 3; i < d.length; i += 4) if (d[i] > 10) n++;
  return n;
}

const green = [0x6a, 0x9e, 0x6a];
const red = [0xb5, 0x67, 0x5e];
const accent = [0xb8, 0x89, 0x4f];
const warn = [0xc3, 0x9a, 0x5a];

const R = {};
try {
  loadColors();
  const c1 = document.getElementById('c1');
  // Ručička leží v pruhu kolem středu plátna. Text s odchylkou je dole a je
  // STEJNĚ BAREVNÝ — kdyby se hledal v celé ploše, stáhne střed k sobě a vyjde
  // nesmyslná hodnota (napoprvé -16 centů místo -38).
  const bandL = (cv) => cv.height * 0.40;
  const bandH = (cv) => cv.height * 0.66;
  const c2 = document.getElementById('c2');
  const c3 = document.getElementById('c3');
  const c4 = document.getElementById('c4');

  /* ── ladění ── */
  drawTuning(c1, { cents: 0, note: 'A4', voiced: true, cls: 'ok' });
  R.tuneCenter = findColor(c1, green, 12, bandL(c1), bandH(c1));
  log(`ladění 0 centů: zelená na x≈${R.tuneCenter.cx?.toFixed(0)} (${R.tuneCenter.n} px)`);

  drawTuning(c1, { cents: -38, note: 'F#4', voiced: true, cls: 'bad' });
  R.tuneLeft = findColor(c1, red, 12, bandL(c1), bandH(c1));
  log(`ladění -38 centů: červená na x≈${R.tuneLeft.cx?.toFixed(0)} (${R.tuneLeft.n} px)`);

  drawTuning(c1, { cents: 38, note: 'A#4', voiced: true, cls: 'bad' });
  R.tuneRight = findColor(c1, red, 12, bandL(c1), bandH(c1));
  log(`ladění +38 centů: červená na x≈${R.tuneRight.cx?.toFixed(0)} (${R.tuneRight.n} px)`);

  drawTuning(c1, { cents: 25, note: 'A4', voiced: true, cls: 'mid' });
  R.tuneMid = findColor(c1, warn, 12, bandL(c1), bandH(c1));
  log(`ladění 25 centů: oranžová na x≈${R.tuneMid.cx?.toFixed(0)} (${R.tuneMid.n} px)`);

  drawTuning(c1, { cents: null, note: null, voiced: false, cls: 'none' });
  R.tuneSilent = { drawn: drawn(c1) };
  R.tuneSilentGreen = findColor(c1, green, 12, bandL(c1), bandH(c1)).n;
  log(`ladění ticho: kresleno ${R.tuneSilent.drawn} px, zelených ${R.tuneSilentGreen}`);

  /* ── SPR historie ── */
  const hist = [-18, -21, -16, -24, -19, -13, -17, -20, -15, -22, -18, -25, -19, -14];
  drawSprHistory(c2, { history: hist, refs: [[REFS.SPR.profesional[0], '#a89f97'], [REFS.SPR.nezpevak[0], '#7d746d']] });
  R.sprLine = findColor(c2, accent, 30);
  log(`SPR historie: akcentní čára ${R.sprLine.n} px, x ${R.sprLine.minX}–${R.sprLine.maxX}, y ${R.sprLine.minY}–${R.sprLine.maxY}`);

  // plochá historie musí dát jinou výšku čáry než rozkmitaná
  drawSprHistory(c2, { history: hist.map(() => -20), refs: null });
  R.sprFlat = findColor(c2, accent, 30);
  log(`SPR plochá: y ${R.sprFlat.minY}–${R.sprFlat.maxY} (rozkmitaná ${R.sprLine.minY}–${R.sprLine.maxY})`);

  drawSprHistory(c2, { history: [], refs: null });
  R.sprEmpty = { drawn: drawn(c2) };
  log(`SPR prázdná: kresleno ${R.sprEmpty.drawn} px (jen mřížka a popis)`);

  /* ── úroveň ── */
  drawLevel(c3, { dbfs: -22, cls: 'ok' });
  R.lvlOk = findColor(c3, green, 40);
  log(`úroveň -22 dB: zelený pruh šířka ${R.lvlOk.maxX - R.lvlOk.minX} px`);

  drawLevel(c3, { dbfs: -55, cls: 'bad' });
  R.lvlLow = findColor(c3, red, 40);
  log(`úroveň -55 dB: červený pruh šířka ${R.lvlLow.maxX - R.lvlLow.minX} px`);

  drawLevel(c3, { dbfs: -6, cls: 'ok' });
  R.lvlHot = findColor(c3, green, 40);
  log(`úroveň -6 dB: zelený pruh šířka ${R.lvlHot.maxX - R.lvlHot.minX} px`);

  drawLevel(c3, { dbfs: -Infinity, cls: 'none' });
  R.lvlSilent = { green: findColor(c3, green, 40).n, red: findColor(c3, red, 40).n };
  log(`úroveň ticho: zelených ${R.lvlSilent.green}, červených ${R.lvlSilent.red} (nesmí svítit)`);

  /* ── FHE ── */
  drawFhe(c4, { fheHz: 2650, ref: REFS.FHE.tenor, band: 'ok' });
  R.fheOk = findColor(c4, green, 30);
  log(`FHE 2650 Hz: značka na x≈${R.fheOk.cx?.toFixed(0)}`);

  drawFhe(c4, { fheHz: 2200, ref: REFS.FHE.tenor, band: 'nizka' });
  R.fheLow = findColor(c4, accent, 30);
  log(`FHE 2200 Hz: značka na x≈${R.fheLow.cx?.toFixed(0)}`);

  drawFhe(c4, { fheHz: 3400, ref: REFS.FHE.tenor, band: 'vysoka' });
  R.fheHigh = findColor(c4, accent, 30);
  log(`FHE 3400 Hz: značka na x≈${R.fheHigh.cx?.toFixed(0)}`);

  // Rozměry pláten se musí hlásit: jsou responzivní, takže test NESMÍ
  // porovnávat pevné pixely — na jiné hustotě displeje nebo šířce okna
  // vyjdou jinak i při správném vykreslení.
  R.canvases = { c1: [c1.width, c1.height], c2: [c2.width, c2.height], c3: [c3.width, c3.height], c4: [c4.width, c4.height] };
  log(`PLÁTNA c1 ${c1.width}x${c1.height} c2 ${c2.width}x${c2.height} c3 ${c3.width}x${c3.height} c4 ${c4.width}x${c4.height}`);

  document.getElementById('hdr').textContent = 'HOTOVO';
  log('\nVÝSLEDKY ' + JSON.stringify(R));
} catch (e) {
  document.getElementById('hdr').textContent = 'CHYBA: ' + e.message;
  log('CHYBA ' + (e.stack || e));
}
</script>
</body>
</html>
